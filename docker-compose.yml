services:
  patentefaunanqn:
    build: .
    container_name: patentefaunanqn
    restart: unless-stopped
    ports:
      - "5100:5000"
    environment:
      - DB_HOST=${DB_HOST:?DB_HOST required}
      - DB_NAME=${DB_NAME:?DB_NAME required}
      - DB_USER=${DB_USER:?DB_USER required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - LOGIN_USER=${LOGIN_USER:?LOGIN_USER required}
      - LOGIN_PASSWORD=${LOGIN_PASSWORD:?LOGIN_PASSWORD required}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - WEB_THREADS=${WEB_THREADS:-4}
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1001:1001"
