name: CI

on:
  pull_request:
    branches: [release]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create test virtualenv
        run: python3 -m venv /tmp/pfn-ci-venv

      - name: Install dependencies
        run: /tmp/pfn-ci-venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt

      - name: Check syntax
        run: /tmp/pfn-ci-venv/bin/python -m compileall -q .

      - name: Run tests
        run: /tmp/pfn-ci-venv/bin/pytest tests/ -v

      - name: Cleanup test venv
        if: always()
        run: rm -rf /tmp/pfn-ci-venv
