name: Deploy

on:
  push:
    branches: [release]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create test virtualenv
        run: python3 -m venv /tmp/pfn-deploy-venv

      - name: Install dependencies
        run: /tmp/pfn-deploy-venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt

      - name: Check syntax
        run: /tmp/pfn-deploy-venv/bin/python -m compileall -q .

      - name: Run tests
        run: /tmp/pfn-deploy-venv/bin/pytest tests/ -v

      - name: Cleanup test venv
        if: always()
        run: rm -rf /tmp/pfn-deploy-venv

  deploy:
    runs-on: self-hosted
    needs: test
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      LOGIN_USER: ${{ secrets.LOGIN_USER }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build --no-cache

      - name: Deploy services
        run: docker compose up -d --remove-orphans --force-recreate

      - name: Wait for healthy
        shell: bash
        run: |
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            health="$(docker inspect -f '{{.State.Health.Status}}' patentefaunanqn 2>/dev/null || true)"
            if [ "$health" = "healthy" ]; then
              curl -f http://localhost:5100/health
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          docker compose ps || true
          docker compose logs --tail 200 || true
          exit 1

      - name: Cleanup old images
        if: success()
        run: docker image prune -f --filter "until=168h" || true
