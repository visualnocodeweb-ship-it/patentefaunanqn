upstream patentefaunanqn_upstream {
    server 127.0.0.1:5100;
    keepalive 64;
}

# HTTP block — serves the app and ACME challenges.
# After certbot runs, it will add the HTTPS server block and
# convert this block into a 301 redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name ai.altermundi.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect bare path to trailing slash
    location = /alpr/neuquen {
        return 301 /alpr/neuquen/;
    }

    location /alpr/neuquen/ {
        proxy_pass http://patentefaunanqn_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /alpr/neuquen;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
