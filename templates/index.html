<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0056b3">
    <meta name="description" content="Sistema de gestión de imágenes LPR para cámaras de tránsito en Neuquén. Consulta detecciones de patentes, vehículos y eventos.">
    <link rel="canonical" href="{{ request.url }}">
    <meta property="og:title" content="Gestión de Imágenes LPR — Patentes Fauna NQN">
    <meta property="og:description" content="Sistema de gestión de imágenes LPR para cámaras de tránsito en Neuquén.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <title>Gestión de Imágenes LPR — Patentes Fauna NQN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <main class="container" id="main-content">
        <div style="text-align:right; margin-bottom: 4px;">
            <a href="{{ url_for('logout') }}" style="font-size:12px; color:#555; text-decoration:none;">Cerrar sesión</a>
        </div>
        <h1>Gestión de Imágenes LPR</h1>

        <div id="stats-bar" class="stats-bar" aria-live="polite">
            <span>Cargando estadísticas…</span>
        </div>

        <div id="latest-thumbnails" class="thumbnail-strip" aria-label="Últimas detecciones"></div>

        <section id="patent-table-section">
            <div class="table-controls">
                <div class="filter-row">
                    <span class="filter-label">Locación:</span>
                    <div id="filter-location-container"></div>
                    <span class="filter-separator">|</span>
                    <input type="text" id="filter-patent" autocomplete="off" placeholder="Patente…" title="Filtrar por patente">
                    <div id="filter-brand-container"></div>
                    <div id="filter-color-container"></div>
                    <div id="filter-type-container"></div>
                    <span class="filter-separator">|</span>
                    <button id="toggle-invalid-plates">Solo inválidas</button>
                    <button id="invert-selection-button">Invertir Selección</button>
                </div>
                <div class="filter-row">
                    <span class="filter-label">Desde</span>
                    <input type="datetime-local" id="filter-start-date" autocomplete="off" title="Fecha y hora desde">
                    <span class="filter-label">Hasta</span>
                    <input type="datetime-local" id="filter-end-date" autocomplete="off" title="Fecha y hora hasta">
                    <button class="time-preset-btn" data-preset="1h">Última hora</button>
                    <button class="time-preset-btn" data-preset="24h">Últimas 24h</button>
                    <button class="time-preset-btn" data-preset="7d">Últimos 7 días</button>
                    <button id="clear-all-filters-button">Limpiar</button>
                </div>
            </div>

            <div class="table-wrapper">
            <table id="patent-table">
                <thead>
                    <tr>
                        <th title="Avistamientos">#</th>
                        <th>Patente</th>
                        <th>Marca</th>
                        <th>Color</th>
                        <th>Tipo</th>
                        <th>Locación</th>
                        <th>Confianza</th>
                        <th>Fecha y Hora</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            </div>

            <div class="pagination-controls">
                <span id="pagination-info" class="pagination-info"></span>
                <div id="pagination-buttons" class="pagination-buttons"></div>
            </div>
        </section>
    </main>

    <!-- The Modal -->
    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Imagen de detección">
        <div class="modal-content">
            <button class="close-button"><span aria-hidden="true">&times;</span><span class="sr-only">Cerrar</span></button>
            <div id="browse-filters" class="browse-filters" hidden>
                <label><input type="checkbox" value="vehicle_detection"> Detección</label>
                <label><input type="checkbox" value="vehicle_picture" checked> Vehículo</label>
                <label><input type="checkbox" value="plate"> Patente</label>
            </div>
            <div id="modal-spinner" class="modal-spinner" hidden></div>
            <div class="carousel-wrapper">
                <button class="carousel-btn carousel-prev"><span aria-hidden="true">&#8249;</span><span class="sr-only">Anterior</span></button>
                <img id="modalImage" src="" alt="Imagen de Patente">
                <button class="carousel-btn carousel-next"><span aria-hidden="true">&#8250;</span><span class="sr-only">Siguiente</span></button>
            </div>
            <span id="carousel-counter" class="carousel-counter"></span>
            <p id="carousel-caption" class="carousel-caption"></p>
            <p id="modal-error" class="modal-error" aria-live="polite" hidden></p>
        </div>
    </div>

    <meta name="app-base" content="{{ request.script_root }}">
    <script src="{{ url_for('static', filename='script.js') }}?v=5"></script>
</body>
</html>
